# Typecheck and the full test suite, on every pull request and every push to main.
# The suite builds the site and runs it against a real Postgres, the same way it does locally.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Never the real forms or a real mailbox: the suite is built on the fake ones.
      FORMS_SOURCE: fake

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The repository's own setup script, so CI also proves the README's local setup works.
      - name: Create the database roles
        run: npm run db:setup
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      - run: npm run typecheck

      - run: npm test
